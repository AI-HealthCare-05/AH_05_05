schema_version: knowledge-chunking-experiments-v1
experiments:
  - experiment_id: section-token-prefix-pilot-v1
    executed_on: "2026-08-24"
    dataset_version: knowledge-pilot-v1
    strategy: >-
      문서 유형별 제목/필드로 섹션을 먼저 분리하고, 최대 크기를 넘는
      섹션만 cl100k_base 토큰 기준으로 재귀 분할한다. embedding_text에는
      문서·약/성분·섹션 접두어를 추가하고 content는 정규화 원문으로 유지한다.
    extraction:
      default_mode: plain
      layout_mode_document_types:
        - PHARM_REVIEW
      reason: >-
        plain 모드는 대부분 문서의 읽기 순서를 보존했다. 팜리뷰는 plain 추출 시
        NUL 문자로 공백이 사라져 layout 모드가 무공백 문자열 비율을 99.7%에서
        0%로 낮췄기 때문에 문서 유형 예외로 고정했다.
    input:
      text_extractable_and_index_eligible_documents: 8
      skipped_ocr_documents: 1
      skipped_unverified_sources: 1
      skipped_structured_sources: 13
    output:
      processed_documents: 8
      chunks: 480
      by_document:
        - source_id: food_safety_korea_supplement_ingredients
          chunks: 4
          min_tokens: 20
          average_tokens: 101.8
          max_tokens: 175
        - source_id: kpicia_adverse_case_report
          chunks: 7
          min_tokens: 20
          average_tokens: 332.1
          max_tokens: 686
        - source_id: kpicia_drug_encyclopedia
          chunks: 12
          min_tokens: 31
          average_tokens: 309.9
          max_tokens: 578
        - source_id: kpicia_pharm_review
          chunks: 7
          min_tokens: 35
          average_tokens: 398.7
          max_tokens: 728
        - source_id: mfds_drug_food_interaction_guide
          chunks: 100
          min_tokens: 34
          average_tokens: 343.0
          max_tokens: 448
        - source_id: mfds_supplement_code
          chunks: 5
          min_tokens: 18
          average_tokens: 145.0
          max_tokens: 490
        - source_id: mfds_supplement_function_guide
          chunks: 332
          min_tokens: 18
          average_tokens: 401.1
          max_tokens: 596
        - source_id: research_supplement_interactions
          chunks: 13
          min_tokens: 59
          average_tokens: 510.7
          max_tokens: 779
    fixes_during_pilot:
      - >-
        모든 PDF에 layout 모드를 적용했을 때 회전 텍스트 누락 경고가 발생해
        팜리뷰에만 layout 모드를 사용하도록 제한했다.
      - >-
        본문의 '상호작용'과 '치료'를 제목으로 오인해 과분할하던 규칙을 제거했다.
        전체 청크 수는 593개에서 532개로 감소했다.
      - >-
        제조기준·제품의 요건 같은 부모 제목과 기호 전용 하위 청크를 제거해
        해당 단계의 청크 수를 531개로 줄였다.
      - >-
        제목 문자열을 본문 어디서나 찾던 방식을 문서 시작·줄 시작·문장 종결
        경계와 뒤쪽 구분자를 확인하는 방식으로 제한했다. 본문 용어를 제목으로
        오인하던 경계가 줄어 파일럿 청크는 531개에서 480개로 감소했다.
      - >-
        OCR_REQUIRED와 출처 미확인 문서의 이전 JSONL이 남지 않도록 문서별
        산출물을 실행 전에 제거한다.
    retrieval_evaluation:
      status: PENDING_QDRANT_PILOT_RELEASE
      planned_metrics:
        hit_at_5_target: 0.90
        citation_accuracy_target: 0.90
        qdrant_search_p95_ms_target: 300
        additional:
          - MRR
          - chunk_boundary_integrity
          - wrong_entity_mixing_count
          - duplicate_retrieval_rate
          - repeated_query_rank_consistency
    decision: >-
      전처리 구조 검증은 통과했다. 아직 임베딩·Qdrant 검색 평가를 수행하지
      않았으므로 전체 원본 확대와 기존 컬렉션 삭제는 보류한다.

  - experiment_id: representative-preprocessing-quality-gate-v1
    executed_on: "2026-08-25"
    dataset_version: knowledge-pilot-v1
    goal: >-
      유형별 대표 문서에서 자동 품질 검사를 먼저 수행하고, 결정론적으로 뽑은
      표본을 사람이 원본과 대조해 승인한 출처만 전체 처리 후보로 만든다.
    automatic_checks:
      - 최소 추출량, 대체문자, 비정상 장문 무공백 문자열
      - 유형별 최대 청크 토큰
      - 제목 사전에 따른 의미 섹션 탐지 비율
    review_sampling:
      strategy: 첫 번째, 가운데, 마지막, 최단, 최장 청크를 중복 없이 선택
      checklist:
        - 원본 읽기 순서
        - 제목과 본문 결합
        - 약명, 성분명, 함량, 단위 보존
        - 서로 다른 개체 또는 사례 혼합 여부
        - 페이지 범위와 출처 위치
    result:
      processed_documents: 8
      chunks: 479
      automatic_pass_documents: 8
      automatic_review_documents: 0
      automatic_blocked_documents: 0
      manual_pending_documents: 8
      ready_for_bulk_sources: 0
    fixes_during_experiment:
      - >-
        약물백과 PDF가 요약A형, 약리작용인체, 부작용가장처럼 제목과 본문
        사이 공백을 제거해 추출되어 의미 섹션 비율이 0이었다. 모든 문서에
        느슨한 규칙을 적용하지 않고 확인된 약물백과 제목만 붙임 본문을
        허용해 의미 섹션 비율을 0.9091로 높였다.
      - >-
        붙임 본문 예외를 약물백과 출처에만 적용하고 줄 시작 또는 숫자 본문
        경계에서만 허용했다. 본문의 '요약하면'을 제목으로 오인하던 청크 1개가
        제거되어 최종 파일럿 청크 수는 479개가 되었다.
      - >-
        자동 BLOCKED 문서는 검수 표본과 보고서만 남기고 Qdrant 입력용
        chunks 디렉터리에는 쓰지 않도록 차단했다.
      - >-
        매니페스트에서 제거되거나 이번 실행에서 제외된 문서의 오래된
        텍스트, 청크, 검수 표본을 함께 제거하도록 정리 범위를 맞췄다.
      - >-
        같은 출처의 대표 문서 중 하나라도 텍스트 품질 검사, 청크 생성 또는
        자동 차단 단계에서 실패하면 다른 대표 문서가 승인되어도 해당 출처를
        전체 처리 가능 상태로 표시하지 않도록 출처 단위 게이트를 보완했다.
      - >-
        Qdrant release 명령이 같은 dataset version의 품질 보고서와 승인 출처
        목록을 검사하도록 연결했다. PENDING, REJECTED 또는 자동 미통과 출처가
        포함되면 OpenAI 임베딩 호출 전에 중단한다.
      - >-
        줄 시작의 '요약하면', '종류는', '부작용은' 같은 일반 문장을 붙임
        제목으로 오인하지 않도록 한국어 서술형 연결 표현을 제외하고, 사람이
        검수하는 표본 청크는 1,200자에서 자르지 않고 전체 내용을 기록한다.
    decision: >-
      대표 문서 8개는 자동 품질 검사를 통과했다. 수동 검수 상태는 모두
      PENDING이므로 전체 원본 확대는 아직 허용하지 않으며, 표본을 원본과
      대조한 뒤 pilot_manifest.json에서 출처별 대표 문서를 APPROVED로
      변경한다.
