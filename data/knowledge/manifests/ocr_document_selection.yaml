schema_version: knowledge-ocr-selection-v1
policy: >-
  OCR_REQUIRED 문서는 원본 PDF와 OCR artifact를 보존하되, 일반 복약·영양제 챗봇의
  근거로 직접 필요한 문서만 허용한다. INCLUDE 문서도 OCR artifact 품질 게이트와
  출처 승인 조건을 모두 통과해야 Qdrant 전처리 대상으로 포함된다.
