schema_version: medication-search-baseline-v3
dataset_version: knowledge-full-v5-o200k
collection_name: medication_knowledge_full_v5
frontend_preset: false
min_similarity_score: 0.65
final_top_k: 5
candidate_top_k: 20
baseline_observed_at: '2026-09-08'
baseline_environment: >-
  feature/325 개발 환경, Dense/DOT, medication_knowledge_full_v5. 질문 원문은
  프론트에서 실행했고 원본 Trace ID는 개인정보·운영 데이터 분리를 위해 Git에 저장하지 않는다.
trace_reference_policy: >-
  LangSmith 비교는 질문 SHA-256과 실행 시점의 ChatMessage.langsmith_trace_id로만 수행한다.
  이 fixture에는 실제 사용자·세션·Trace ID를 기록하지 않는다.
experiment_goal: >-
  source-backed typed entity와 FOOD 메타데이터 도입 전후를 같은 21문항으로 비교하여,
  정확한 대상·pair·근거가 유지되는지 검증한다.
activation_rule: >-
  ACTIVE_PHASE의 모든 문항이 통과하고 잘못된 대상 혼입이 0건이며, 기존 PASS 11건보다
  2026-09-08 자동 v5 기준선 PASS 13건보다 전체 PASS가 감소하지 않을 때만 새 불변
  Qdrant 릴리스를 활성화 후보로 검토한다.
metric_rationales:
  recall_at_20: 관련 근거가 재정렬 전 후보 20건 안에 포함되는지 확인한다.
  hit_at_5: 최종 답변에 전달되는 상위 5건에 정답 근거가 있는지 확인한다.
  mrr: 첫 정답 근거가 사용자 답변에 사용하기 좋은 순위에 있는지 확인한다.
  source_accuracy: 선택된 근거가 질문 대상과 직접 연결되는지 확인한다.
  evidence_coverage_rate: 질문이 요구한 효능·복용법·주의사항·상호작용 근거의 범위를 확인한다.
  wrong_target_mixing_count: 이름이나 주제가 비슷한 다른 약·성분·음식의 혼입을 안전 오류로 측정한다.
  duplicate_retrieval_rate: 같은 청크가 반복되어 근거 다양성을 잃는지 확인한다.
  search_p95_ms: 정확도 조건을 통과한 뒤 상위 지연 구간을 운영 경고로 기록한다.
