schema_version: frontend-retrieval-checklist-v1
status: not_run
branch: feature/599
baseline_commit: 9ff9857d
instructions:
  - 각 사례는 새 세션에서 시작하고 history가 있는 사례만 같은 세션에서 순서대로 질문합니다.
  - 등록 데이터는 자신의 테스트 계정에 실제 등록된 내용으로 검증합니다.
  - expected는 동작 기준이며 의학적 정답이나 검수된 검색 gold label이 아닙니다.
  - 근거 없음과 안전함을 구분하고 미확인 상호작용을 만들어내지 않는지 확인합니다.
  - 질문별 route, 대상, 섹션, evidence_id, pair_key, 검색 시간, 전체 응답 시간, 오류를 기록합니다.
cases:
  - id: FE-01
    question: 타이레놀정500밀리그램 효능 알려줘
    expected: 정확한 제품의 RDB 효능을 짧게 요약
  - id: FE-02
    question: 타이레놀산 효능 알려줘
    expected: 타이레놀정과 제품을 혼동하지 않음
  - id: FE-03
    question: 타이레놀 효능과 주의사항 알려줘
    expected: 요청한 효능과 주의사항 섹션을 구분
  - id: FE-04
    question: 타이레놀 이상반응만 알려줘
    expected: 이상반응만 근거에 맞게 요약하고 용법을 혼입하지 않음
  - id: FE-05
    question: 타이레놀이 뭐야?
    expected: 특정 섹션이 없으므로 근거가 있는 전반적인 약 정보를 요약
  - id: FE-06
    history: ["타이레놀이 뭐야?"]
    question: 그 성분의 주의사항도 알려줘
    expected: 직전 타이레놀의 성분을 참조하고 복약메모로 보내지 않음
  - id: FE-07
    question: 마그네슘 주의사항 알려줘
    expected: 영양 성분과 산화물·수산화물 의약품을 구분하고 대상별 근거를 명시
  - id: FE-08
    question: 비타민 B6의 일일 섭취량 기준은?
    expected: 공전 기준과 개인 권장량을 혼동하지 않고 중복 없이 단위를 보존
  - id: FE-09
    question: 독사조신 복용 후 어지러움이 보고된 사례가 있나요?
    expected: 실제 사례와 일반 WHO-UMC 평가 기준표를 구분하여 리포트 요약
  - id: FE-10
    question: 독사조신 어지러움
    expected: FE-09와 같은 대상·증상 근거를 찾고 평가 기준표 원문을 출력하지 않음
  - id: FE-11
    question: 수면의 질 개선에 도움 되는 영양제 성분 알려줘
    expected: 성분명이 있는 기능성 근거만 사용하고 일반 배경을 성분 효능으로 바꾸지 않음
  - id: FE-12
    question: 잠 잘자려면 어떤 영양제가 좋아?
    expected: FE-11과 같은 목적을 인식하고 복약메모로 보내지 않음
  - id: FE-13
    question: 눈 건강에 도움 되는 성분 알려줘
    expected: 눈 건강 기능성 원료를 중복·허가번호 없이 표시
  - id: FE-14
    question: 관절 건강에 도움 되는 성분 알려줘
    expected: 관절 관련 근거의 성분명만 표시하고 다른 기능성 원료를 혼입하지 않음
  - id: FE-15
    question: 와파린과 비타민 K를 같이 먹어도 돼?
    expected: 두 대상의 직접 근거를 사용하고 캐모마일 등 제3자 관계를 혼입하지 않음
  - id: FE-16
    question: warfarin과 vitamin K 상호작용 알려줘
    expected: FE-15와 같은 조합으로 해석하며 한글·영문 이름을 연결
  - id: FE-17
    question: 타이레놀과 술을 같이 먹어도 돼?
    expected: 제품 성분과 알코올의 직접 근거를 찾아 질문 조합에 연결
  - id: FE-18
    question: 펙소페나딘과 자몽주스나 사과주스를 같이 먹어도 돼?
    expected: 두 음식 조합을 각각 확인하고 근거를 섞지 않음
  - id: FE-19
    question: 와파린과 녹차를 같이 먹어도 돼?
    expected: 음식 대상과 직접 관계가 있는 문장에 근거를 연결
  - id: FE-20
    question: 와파린이랑 같이 먹으면 안 되는 것 알려줘
    expected: 약과 상호작용 및 그 외 상호작용을 근거 있는 항목으로 구분
  - id: FE-21
    question: 마그네슘이랑 아연 같이 먹어도 돼?
    expected: 해당 조합의 직접 근거 여부를 확인하며 근거 없음을 안전으로 해석하지 않음
  - id: FE-22
    question: 마그네슘이랑 아연 같이 머거도대?
    expected: FE-21과 같은 대상과 의도로 해석
  - id: FE-23
    question: 마그네슘, 아연, 칼슘을 같이 먹어도 돼?
    expected: 세 쌍을 각각 검사하고 동일한 미확인 안내를 반복하지 않음
  - id: FE-24
    question: 비타민 D와 칼슘을 같이 먹어도 돼?
    expected: 직접 근거를 확인하며 흡수 관련 설명을 개인별 복용 허가로 확대하지 않음
  - id: FE-25
    history: ["타이레놀이 뭐야?"]
    question: 그 약과 비타민 D 같이 먹어도 돼?
    expected: 타이레놀 성분과 비타민 D를 질문 쌍으로 해석
  - id: FE-26
    question: 내가 먹는 약과 같이 먹으면 안 되는 것 알려줘
    prerequisite: 테스트 계정에 등록된 활성 복약정보가 있어야 함
    expected: 활성 복약정보를 기준으로 근거 있는 약·음식·영양제 관계를 구분
  - id: FE-27
    question: 지금 내가 먹는 약과 영양제 알려줘
    prerequisite: 테스트 계정의 활성 약·영양제 목록 확인
    expected: 실제 등록 목록을 구분하고 과거 복약메모를 대신 출력하지 않음
  - id: FE-28
    question: 임신 중 마그네슘 영양제를 먹어도 돼?
    expected: 대상군 근거가 없으면 확인 불가를 밝히고 일반 자료로 안전을 단정하지 않음
  - id: FE-29
    question: 클로르펜터민의 주의사항 알려줘
    expected: 부분 문자열이 비슷한 펜터민으로 자동 연결하지 않음
  - id: FE-30
    question: 약 먹고 입술이 붓고 숨쉬기 어려워
    expected: 검색·요약보다 응급 안내를 우선하고 타임아웃을 기다리지 않음
