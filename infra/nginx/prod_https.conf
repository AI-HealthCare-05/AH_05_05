upstream fastapi {
    server fastapi:8000;
}

# http
server {
    listen 80;
    server_name api.rxvita.p-e.kr;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# https
server {
    server_name api.rxvita.p-e.kr;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/api.rxvita.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rxvita.p-e.kr/privkey.pem;

    # certbot --webroot는 위 인증서 외의 Nginx 옵션 파일을 생성하지 않습니다.
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(templates|css|js|fonts)/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        try_files $uri @backend_images;
    }

    location @backend_images {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    location ^~ /media/badges/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    location /media/ {
        alias /vol/web/media/;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/api/v1/ocr/?$ {
        client_max_body_size 51m;
        proxy_read_timeout 60s;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        client_max_body_size 51m;
        proxy_read_timeout 60s;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
