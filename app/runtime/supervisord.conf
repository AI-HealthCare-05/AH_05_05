[unix_http_server]
file=/run/ocr-runtime/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/ocr-runtime/supervisord.pid
childlogdir=/run/ocr-runtime
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/ocr-runtime/supervisor.sock

[eventlistener:fatal-guard]
command=/app/.venv/bin/python -m app.runtime.fatal_guard
events=PROCESS_STATE_FATAL
priority=0
autostart=true
autorestart=true
startsecs=1
startretries=3
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:image-redis]
command=/usr/bin/redis-server /app/app/runtime/image-redis.conf
priority=10
autostart=true
autorestart=true
exitcodes=0
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ocr-worker]
command=/app/.venv/bin/python -m app.runtime.combined gate --timeout 5 -- /app/.venv/bin/python -m arq app.workers.medication_guide_ocr_worker.WorkerSettings
priority=20
autostart=true
autorestart=true
exitcodes=0
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=75
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/app/.venv/bin/python -m app.runtime.combined gate --timeout 5 -- /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
priority=30
autostart=true
autorestart=true
exitcodes=0
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
