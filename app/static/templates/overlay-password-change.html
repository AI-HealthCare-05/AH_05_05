<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>비밀번호 변경</title></head><body><!-- 제목·안내 문구에만 인라인 스타일을 쓴다. 다른 오버레이는 Tailwind 유틸리티(text-lg,
 text-sm, text-gray-600)로 같은 값을 내지만, 이 오버레이가 열리는 로그인 화면은 Tailwind 를
 불러오지 않아 클래스가 먹지 않는다. 값은 그 유틸리티와 동일하게 맞췄다. --><form class="overlay-panel overlay-form" data-overlay-panel role="dialog" aria-modal="true" aria-labelledby="password-change-title"><h2 id="password-change-title" style="margin:0; font-size:18px; line-height:28px; font-weight:600;">비밀번호 변경</h2><p style="margin:0; font-size:14px; line-height:20px; color:#4b5563;">8자 이상, 대문자·소문자·숫자·특수문자를 각각 1개 이상 포함해야 합니다.</p><div class="overlay-field"><label for="current-password">현재 비밀번호</label><input id="current-password" name="currentPassword" type="password" class="ui-control" autocomplete="current-password"><span class="overlay-error" data-error-for="currentPassword"></span></div><div class="overlay-field"><label for="new-password">새 비밀번호</label><input id="new-password" name="newPassword" type="password" class="ui-control" autocomplete="new-password"><span class="overlay-error" data-error-for="newPassword"></span></div><div class="overlay-field"><label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="newPasswordConfirm" type="password" class="ui-control" autocomplete="new-password"><span class="overlay-error" data-error-for="newPasswordConfirm"></span></div><div class="overlay-actions"><button data-overlay-close class="ui-button" type="button">취소</button><button data-overlay-confirm class="ui-button ui-button-primary" type="button">변경 완료</button></div></form></body></html>
