<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 등록</title></head>
<body>
<form class="overlay-panel overlay-form" data-overlay-panel role="dialog" aria-modal="true"
      aria-labelledby="admin-register-title"><h2 id="admin-register-title" class="text-lg font-semibold">관리자 등록</h2>
    <div class="overlay-field"><label for="admin-name">이름</label>
        <input id="admin-name" name="name" class="ui-control">
        <span class="overlay-error" data-error-for="name"></span>
    </div>
    <div class="overlay-field">
        <label for="admin-email">이메일 주소</label>
        <input id="admin-email" name="email" type="email" class="ui-control">
        <span class="overlay-error" data-error-for="email"></span>
    </div>
    <div class="overlay-field">
        <label for="admin-role">권한 역할</label>
        <select id="admin-role" name="role"  class="ui-control">
            <option>일반 관리자</option>
        </select>
    </div>
    <div class="overlay-actions">
        <button data-overlay-close class="ui-button" type="button">취소</button>
        <button data-overlay-confirm class="ui-button ui-button-primary" type="button">등록</button>
    </div>
</form>
</body>
</html>
