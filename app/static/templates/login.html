<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 - AI HEALTH ASSISTANT</title>
  <link rel="stylesheet" href="../css/styles.css?v=20260831-3">
  <!-- 비밀번호 변경 오버레이가 쓰는 스타일. management.css 는 .ui-control·.ui-button 과 토스트를,
       overlays.css 는 패널·배경·입력칸 오류 표시를 담당한다. 로그인 화면은 자체 클래스만 써서
       (login-card, text-input …) 두 파일을 넣어도 기존 화면에 영향이 없다. -->
  <link rel="stylesheet" href="../css/management.css?v=20260831-3">
  <link rel="stylesheet" href="../css/overlays.css?v=20260831-3">
  <script type="module" src="../js/login.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <header class="brand">
        <img class="brand-logo" src="../images/rxvita-logo-ai-chat-navy.png" alt="RxVita">
        <p class="brand-name">AI HEALTH ASSISTANT</p>
      </header>

      <h1 id="login-title" class="login-title">관리자 로그인</h1>

      <form class="login-form" data-login-form data-dashboard-url="dashboard.html" novalidate>
        <div class="form-field">
          <label class="form-label" for="login-id">관리자 ID</label>
          <div class="input-wrap">
            <input id="login-id" class="text-input" name="loginId" type="text" autocomplete="username" placeholder="admin_ops_01@ozcoding.ai" aria-describedby="login-id-error">
          </div>
          <span id="login-id-error" class="field-error" data-error-for="loginId" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label class="form-label" for="password">비밀번호</label>
          <div class="input-wrap">
            <input id="password" class="text-input" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" aria-describedby="password-error">
            <button class="icon-button" type="button" data-password-toggle aria-label="비밀번호 표시" aria-pressed="false">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span id="password-error" class="field-error" data-error-for="password" aria-live="polite"></span>
        </div>

        <div class="login-options">
          <a class="password-help" href="#" data-password-help aria-label="비밀번호 찾기 안내">비밀번호 찾기</a>
        </div>

        <button class="login-button" type="submit">보안 로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
