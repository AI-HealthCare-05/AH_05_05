<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 정지 확인</title></head>
<body>
<section class="overlay-panel" data-overlay-panel role="dialog" aria-modal="true" aria-labelledby="suspend-title">
    <h2 id="suspend-title" class="text-lg font-semibold">회원 계정을 정지하시겠어요?</h2>
    <p class="text-sm text-gray-600 mt-3">계정 접근 권한이 제한되며 다시 활성화할 수 있습니다.</p>
    <div class="overlay-actions">
        <button data-overlay-close class="ui-button" type="button">취소</button>
        <button data-overlay-confirm class="ui-button ui-button-danger" type="button">정지</button>
    </div>
</section>
</body>
</html>
