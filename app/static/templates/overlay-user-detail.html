<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 상세 정보</title></head>
<body>
<aside class="overlay-panel overlay-panel-wide" data-overlay-panel role="dialog" aria-modal="true"
       aria-labelledby="user-detail-title">
    <header class="flex justify-between items-center">
        <div><span data-user-status class="status-badge status-active">활성 회원</span>
            <h2 id="user-detail-title" data-user-name class="text-xl font-bold mt-3">회원 이름</h2>
            <p data-user-id class="text-sm text-gray-500">(회원 ID : 00)</p></div>
        <button data-overlay-close class="ui-button" type="button" aria-label="회원 상세 닫기">×</button>
    </header>
    <dl class="grid gap-4 mt-8">
        <div>
            <dt class="text-xs text-gray-500">이메일 주소</dt>
            <dd data-user-email>email@example.com</dd>
        </div>
        <div>
            <dt class="text-xs text-gray-500">전화번호</dt>
            <dd data-user-phone>-</dd>
        </div>
        <div>
            <dt class="text-xs text-gray-500">가입일</dt>
            <dd data-user-joined>-</dd>
        </div>
    </dl>
    <div class="overlay-actions">
        <button data-overlay-close class="ui-button" type="button">닫기</button>
        <button data-overlay-confirm class="ui-button ui-button-danger" type="button">계정 정지</button>
    </div>
</aside>
</body>
</html>
