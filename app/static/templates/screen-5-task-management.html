<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>작업 모니터링 - Ozcoding_AI.health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/management.css?v=20260825-2">
    <link rel="stylesheet" href="../css/overlays.css">
    <script type="module" src="../js/navigation.js"></script>
    <script type="module" src="../js/sidebar.js?v=20260825-2"></script>
    <script type="module" src="../js/task-management.js"></script>
</head>
<body class="management-page flex min-h-screen">
<!-- sidebar -->
<aside data-sidebar data-active-nav="tasks"
       class="desktop-sidebar sidebar-shell bg-white flex flex-col h-screen items-start justify-between px-4 py-6 w-[240px] shrink-0"
       aria-label="관리자 메뉴"><span class="text-sm text-gray-500">메뉴 불러오는 중...</span>
</aside>
<!-- //sidebar -->
<main class="flex-1 min-w-0">
    <header class="bg-white h-16 px-6 flex items-center border-b"><h1 class="text-xl font-semibold">작업 모니터링</h1>
    </header>
    <section class="p-6">
        <div class="grid grid-cols-3 gap-4 mb-5">
            <article class="card"><small>진행 중</small><strong class="block text-2xl">1</strong></article>
            <article class="card"><small>성공</small><strong class="block text-2xl">2</strong></article>
            <article class="card"><small>실패</small><strong class="block text-2xl">1</strong></article>
        </div>
        <div class="management-toolbar flex gap-3 mb-5 flex-wrap"><input data-task-search class="ui-control"
                                                                         type="search" placeholder="작업 ID 또는 유형 검색"
                                                                         aria-label="작업 검색"><select data-task-type
                                                                                                    class="ui-control"
                                                                                                    aria-label="작업 유형">
            <option>전체</option>
            <option>OCR 추출</option>
            <option>알림 발송</option>
            <option>챗봇 응답 검수</option>
        </select><select data-task-status class="ui-control" aria-label="작업 상태">
            <option>전체</option>
            <option>진행 중</option>
            <option>성공</option>
            <option>실패</option>
        </select>
            <button data-task-reset class="ui-button">필터 초기화</button>
        </div>
        <div class="management-table-wrap bg-white rounded-xl border">
            <table class="management-table w-full text-sm">
                <thead class="bg-gray-50">
                <tr>
                    <th>작업 ID</th>
                    <th>유형</th>
                    <th>담당자</th>
                    <th>시작 시각</th>
                    <th>상태</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody data-task-rows></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
