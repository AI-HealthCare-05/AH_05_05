<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>작업 모니터링 - Ozcoding_AI.health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/management.css">
    <link rel="stylesheet" href="../css/overlays.css">
    <script type="module" src="../js/navigation.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/task-management.js"></script>
</head>
<body class="management-page flex min-h-screen">
<!-- sidebar -->
<aside data-sidebar data-active-nav="tasks"
       class="desktop-sidebar sidebar-shell bg-white flex flex-col h-screen items-start justify-between px-4 py-6 w-[240px] shrink-0"
       aria-label="관리자 메뉴"><span class="text-sm text-gray-500">메뉴 불러오는 중...</span>
</aside>
<!-- //sidebar -->
<main class="flex-1 min-w-0">
    <header class="bg-white h-16 px-6 flex items-center border-b"><h1 class="text-xl font-semibold">작업 모니터링</h1>
    </header>
    <section class="p-6">
        <div class="task-status-grid mb-5" aria-label="작업 상태별 건수">
            <article class="card task-status-card">
                <div class="task-status-label"><small>진행 대기</small><span class="task-status-help" tabindex="0"
                                                                         aria-describedby="task-help-queued">!</span><span
                        class="task-status-tooltip" id="task-help-queued" role="tooltip">작업 생성 및 Redis/ARQ 큐 등록 시</span>
                </div>
                <strong data-task-count-queued>0</strong>
            </article>
            <article class="card task-status-card">
                <div class="task-status-label"><small>진행중</small><span class="task-status-help" tabindex="0"
                                                                       aria-describedby="task-help-processing">!</span><span
                        class="task-status-tooltip" id="task-help-processing"
                        role="tooltip">alarm-worker가 작업을 선점했을 때</span></div>
                <strong data-task-count-processing>0</strong>
            </article>
            <article class="card task-status-card">
                <div class="task-status-label"><small>성공</small><span class="task-status-help" tabindex="0"
                                                                      aria-describedby="task-help-completed">!</span><span
                        class="task-status-tooltip" id="task-help-completed"
                        role="tooltip">Web Push 발송 요청이 성공했을 때</span></div>
                <strong data-task-count-completed>0</strong>
            </article>
            <article class="card task-status-card">
                <div class="task-status-label"><small>실패</small><span class="task-status-help" tabindex="0"
                                                                      aria-describedby="task-help-failed">!</span><span
                        class="task-status-tooltip" id="task-help-failed" role="tooltip">영구 오류 또는 최대 재시도 횟수 초과 시</span>
                </div>
                <strong data-task-count-failed>0</strong>
            </article>
            <article class="card task-status-card">
                <div class="task-status-label"><small>재시도 대기</small><span class="task-status-help" tabindex="0"
                                                                          aria-describedby="task-help-retry-waiting">!</span><span
                        class="task-status-tooltip" id="task-help-retry-waiting" role="tooltip">일시적인 발송 실패가 발생했지만 재시도 횟수가 남았을 때</span>
                </div>
                <strong data-task-count-retry-waiting>0</strong>
            </article>
            <article class="card task-status-card">
                <div class="task-status-label"><small>취소</small><span class="task-status-help" tabindex="0"
                                                                      aria-describedby="task-help-cancelled">!</span><span
                        class="task-status-tooltip" id="task-help-cancelled" role="tooltip">관리자 취소 또는 실행 대상이 더 이상 유효하지 않을 때</span>
                </div>
                <strong data-task-count-cancelled>0</strong>
            </article>
        </div>
        <div class="management-toolbar flex gap-3 mb-5 flex-wrap">
            <input data-task-search class="ui-control" type="search" placeholder="작업 ID" aria-label="작업 검색">
            <select data-task-type class="ui-control" aria-label="작업 유형">
                <option>전체</option>
                <option>OCR</option>
                <option>LLM</option>
                <option>CHAT</option>
                <option>ALARM</option>
            </select>
            <select data-task-status class="ui-control" aria-label="작업 상태">
                <option>전체</option>
                <option>진행 대기</option>
                <option>진행중</option>
                <option>성공</option>
                <option>실패</option>
                <option>재시도 대기</option>
                <option>취소</option>
            </select>
            <div class="task-date-range" role="group" aria-label="조회 기간">
                <span>조회기간:</span>
                <input data-task-start-date class="ui-control" type="date" aria-label="조회 시작일">
                <span aria-hidden="true">~</span>
                <input data-task-end-date class="ui-control" type="date" aria-label="조회 종료일">
            </div>
            <button data-task-search-button class="ui-button ui-button-primary" type="button">조회</button>
            <button data-task-reset class="ui-button">필터 초기화</button>
        </div>
        <div class="management-table-wrap bg-white rounded-xl border">
            <table class="management-table w-full text-sm">
                <thead class="bg-gray-50">
                <tr>
                    <th>작업 ID</th>
                    <th>유형</th>
                    <th>사용자</th>
                    <th>요청 시각</th>
                    <th>상태</th>
                    <th>오류</th>
                </tr>
                </thead>
                <tbody data-task-rows></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
