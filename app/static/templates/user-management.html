<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>회원 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/management.css?v=20260825-2">
    <link rel="stylesheet" href="../css/overlays.css">
    <script type="module" src="../js/navigation.js"></script>
    <script type="module" src="../js/sidebar.js?v=20260825-2"></script>
    <script type="module" src="../js/user-management.js?v=20260827-1"></script>
</head>
<body class="management-page flex min-h-screen">
<!-- sidebar -->
<aside data-sidebar data-active-nav="users"
       class="desktop-sidebar sidebar-shell bg-white flex flex-col h-screen items-start justify-between px-4 py-6 w-[240px] shrink-0"
       aria-label="관리자 메뉴"><span class="text-sm text-gray-500">메뉴 불러오는 중...</span>
</aside>
<!-- //sidebar -->
<main class="flex-1 min-w-0">
    <header class="bg-white h-16 px-6 flex items-center border-b"><h1 class="text-xl font-semibold">회원 관리</h1>
    </header>
    <section class="p-6">
        <div class="management-toolbar flex justify-between gap-3 mb-5">
            <div class="flex gap-3 flex-wrap console-filters"><input data-user-search class="ui-control" type="search"
                                                     placeholder="이름, 이메일 검색" aria-label="회원 검색"><select
                    data-user-status class="ui-control" aria-label="회원 상태">
                <option>전체</option>
                <option>활성</option>
                <option>정지</option>
            </select>
                <button data-user-reset class="ui-button" type="button">필터 초기화</button>
            </div>
        </div>
        <div class="management-table-wrap bg-white rounded-xl border">
            <table class="management-table console-table w-full text-sm">
                <thead class="bg-gray-50">
                <tr>
                    <th>회원 ID</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                    <th>가입일</th>
                    <th>상태</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody data-user-rows></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
