<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title></head>
<body>
<section class="overlay-panel" data-overlay-panel role="dialog" aria-modal="true" aria-labelledby="password-reset-title">
    <h2 id="password-reset-title" class="text-lg font-semibold">임시 비밀번호를 발송하시겠습니까?</h2>
    <p class="text-sm text-gray-600 mt-3">임시 비밀번호를 새로 발급해 이메일로 발송합니다.</p>
    <p class="text-sm text-gray-600 mt-2">기존 비밀번호는 사용할 수 없습니다.</p>
    <div class="overlay-actions">
        <button data-overlay-close class="ui-button">취소</button>
        <button data-overlay-confirm class="ui-button ui-button-danger">확인</button>
    </div>
</section>
</body>
</html>
