<!doctype html>
<html lang="ko">
  <body style="margin:0;background:#f5f7f8;font-family:Arial,'Noto Sans KR',sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f8;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:20px;padding:36px 28px">
            <tr><td align="center"><img src="cid:rxvita-logo" alt="RxVita" width="150" style="display:block;max-width:150px;height:auto"></td></tr>
            <tr><td align="center" style="padding-top:28px;font-size:24px;font-weight:700">회원가입 이메일 인증번호</td></tr>
            <tr><td align="center" style="padding-top:12px;font-size:15px;line-height:1.6;color:#59636f">아래 인증번호를 회원가입 화면에 입력해 주세요.</td></tr>
            <tr>
              <td align="center" style="padding:28px 0">
                <table role="presentation" cellspacing="8" cellpadding="0"><tr>
                  {% for digit in verification_code %}
                  <td class="verification-digit" align="center" style="width:48px;height:58px;border:1px solid #cfd8dc;border-radius:10px;background:#f7fbfa;font-size:30px;font-weight:700;color:#0b7f75">{{ digit }}</td>
                  {% endfor %}
                </tr></table>
              </td>
            </tr>
            <tr><td align="center" style="font-size:14px;line-height:1.7;color:#59636f">인증번호는 <strong>{{ verification_expiry }} 동안 유효</strong>합니다.<br>본인이 요청하지 않았다면 이 메일을 무시해 주세요.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
