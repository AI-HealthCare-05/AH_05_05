<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RxVita 비밀번호 재설정</title>
  </head>
  <body style="margin:0;background:#f5f7f8;font-family:Arial,'Noto Sans KR',sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f7f8;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border-radius:20px;padding:36px 28px">
            <tr><td align="center"><img src="cid:rxvita-logo" alt="RxVita" width="150" style="display:block;max-width:150px;height:auto"></td></tr>
            <tr><td align="center" style="padding-top:28px;font-size:24px;font-weight:700">비밀번호 재설정</td></tr>
            <tr><td align="center" style="padding-top:12px;font-size:15px;line-height:1.7;color:#59636f">아래 임시비밀번호로 로그인해 주세요.</td></tr>
            <tr>
              <td align="center" style="padding:28px 0">
                <div class="temporary-password" style="font-size:20px;font-weight:700;line-height:1.5;color:#0b7f75;text-align:center;word-break:break-all">{{ temporary_password }}</div>
              </td>
            </tr>
            <tr><td align="center" style="font-size:14px;line-height:1.8;color:#59636f">로그인 후 비밀번호를 변경해 주세요.</td></tr>
            <tr><td align="center" style="padding-top:22px;font-size:14px;color:#59636f">감사합니다.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
