<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 정지 확인</title></head>
<body>
<section class="overlay-panel" data-overlay-panel role="dialog" aria-modal="true" aria-labelledby="admin-stop-title">
    <h2 id="admin-stop-title" class="text-lg font-semibold">관리자 계정을 정지하시겠습니까?</h2>
    <!-- 목록이 최신순이라 행이 밀린다. 무엇을 정지하는지 여기서 다시 보여준다. -->
    <p class="mt-3 text-sm font-semibold text-gray-900">
        <span data-confirm-name></span>
        <span data-confirm-email class="font-normal text-gray-600"></span>
    </p>
    <p class="text-sm text-gray-600 mt-2">접근 권한이 제한됩니다.</p>
    <div class="overlay-actions">
        <button data-overlay-close class="ui-button">취소</button>
        <button data-overlay-confirm class="ui-button ui-button-danger">정지</button>
    </div>
</section>
</body>
</html>
